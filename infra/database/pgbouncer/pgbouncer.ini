[databases]
kantorcore = host=postgres port=5432 dbname=kantorcore

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction mode (D13). The app uses postgres-js with prepare:false; DBOS and
; LISTEN/NOTIFY must use a DIRECT connection to Postgres, not this pool (ARCH §4).
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 5

; Let clients send parameters PgBouncer doesn't track in transaction mode.
ignore_startup_parameters = extra_float_digits,options
